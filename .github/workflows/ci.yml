name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # RouteContext / LayoutProps are generated by Next; a fresh checkout has none yet
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run cf:build
